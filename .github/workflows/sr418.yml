name: StarRocks 4.1.8 compatibility
on:
  push:
    branches: ["measure/uat418"]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  uat:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: uv sync --group dev --extra starrocks --extra duckdb
      - name: Acceptance sweep
        env: {BENCHBOX_HEAVY_MEMORY_BUDGET_GIB: '13'}
        run: make uat-sweep CONFIG=tests/uat/configs/starrocks-418-probe.yaml PLATFORMS=starrocks
      - name: Live tests and transaction probe
        if: always()
        run: |
          image=$(grep -oE 'starrocks/allin1-ubuntu:[^ ]+' docker/starrocks/docker-compose.yml)
          docker run -d --name sr --memory 8g -p 9030:9030 -p 8040:8040 "$image"
          for _ in $(seq 1 120); do docker exec sr mysql -h127.0.0.1 -P9030 -uroot --skip-password -N -e 'SHOW BACKENDS' 2>/dev/null | grep -q true && break; sleep 2; done
          uv run -- python diag/txn.py
          STARROCKS_HOST_PORT=9030 STARROCKS_HTTP_PORT=8040 uv run -- python -m pytest -n 0 -m live_starrocks tests/integration/platforms/test_starrocks_live.py -rs
      - name: Summary matrix
        if: always()
        run: find ~/Developer/benchmark_runs/logs -name 'matrix_summary.tsv' -exec cat {} +
